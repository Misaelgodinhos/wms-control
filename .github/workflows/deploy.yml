name: Build and deploy WMS Control

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Use a project-specific group so this deployment is not cancelled by another Pages workflow.
concurrency:
  group: wms-control-pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://ftlspegsluzibjulbnst.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_HqlxVoE1zToD9ML5H4_DVA_I4Uh6vG6

      - name: Verify compiled site
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          if grep -q 'src/main.tsx' dist/index.html; then
            echo "ERRO: dist/index.html ainda aponta para src/main.tsx; o build não foi compilado."
            cat dist/index.html
            exit 1
          fi
          grep -q '/wms-control/assets/' dist/index.html
          find dist -maxdepth 2 -type f -print

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload compiled site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy compiled artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
